# ============================================================
#  Nginx config for NIT Library ID Card System
#
#  To install on EC2:
#    sudo cp ~/Library/deployment/nginx.conf /etc/nginx/sites-available/library
#    sudo ln -sf /etc/nginx/sites-available/library /etc/nginx/sites-enabled/library
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl restart nginx
# ============================================================

server {
    listen 80;
    server_name 15.206.74.151;

    client_max_body_size 20M;

    # ── Frontend (React build) ─────────────────────────────────
    location / {
        root /home/ubuntu/Library/frontend/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Backend API ────────────────────────────────────────────
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow long PDF generation times
        proxy_connect_timeout 300;
        proxy_send_timeout    300;
        proxy_read_timeout    300;
        send_timeout          300;
    }
}
